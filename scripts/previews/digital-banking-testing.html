<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Digital banking testing workflow — illustrative reconstruction</title>
<style>
/* Deterministic, time-driven scene: window.render(t) draws the frame for t seconds. Used only to render the portfolio preview assets. */
:root{--bg:#14132a;--panel:#1a1933;--panel2:#201f3d;--line:rgba(236,232,217,.12);--fg:#ece8d9;--mut:#9a97b4;--dim:#6b6990;--ok:#5fd08f;--warn:#f2b84b;--bad:#ff6b6b;--kw:#c4a4f2;--str:#f2cf86;--fn:#8fd3f4;--ty:#7ee0b0;--cm:#6e6b8c;--acc:#8c83ff;--mono:"SF Mono",Menlo,Consolas,monospace;--ui:-apple-system,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--ui)}
#stage{position:relative;width:1920px;height:1080px;background:var(--bg)}
.bar{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 24px;background:#100f22;border-bottom:1px solid var(--line);font-size:18px;color:var(--mut)}
.dots{display:flex;gap:9px}.dots i{width:14px;height:14px;border-radius:50%}.dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.bar .t{flex:1;text-align:center;font-family:var(--mono);font-size:17px}
.chip{font-family:var(--mono);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);border:1px solid rgba(242,184,75,.4);border-radius:999px;padding:5px 12px}
.rail{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;gap:28px;padding:0 32px;background:#100f22;border-top:1px solid var(--line);font-family:var(--mono);font-size:17px;color:var(--mut)}
.rail b{color:var(--fg);font-weight:500}.segs{display:flex;gap:8px;flex:1}.seg{flex:1;height:6px;border-radius:3px;background:rgba(236,232,217,.12);overflow:hidden}.seg i{display:block;height:100%;background:var(--acc)}
.scene{position:absolute;left:0;top:56px;width:1920px;height:960px;opacity:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph{padding:12px 18px;font-family:var(--mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.code{font-family:var(--mono);font-size:22px;line-height:34px;white-space:pre}
.ln{display:flex}.ln .n{width:64px;text-align:right;padding-right:20px;color:var(--dim);flex:none}.ln .c{flex:1;padding-left:8px}
.add{background:rgba(95,208,143,.14);box-shadow:inset 4px 0 0 var(--ok)}.del{background:rgba(255,107,107,.14);box-shadow:inset 4px 0 0 var(--bad)}.hl{background:rgba(242,184,75,.16);box-shadow:inset 4px 0 0 var(--warn)}
.k{color:var(--kw)}.s{color:var(--str)}.f{color:var(--fn)}.y{color:var(--ty)}.m{color:var(--cm)}.ok{color:var(--ok)}.wn{color:var(--warn)}.bd{color:var(--bad)}.mu{color:var(--mut)}
.term{font-family:var(--mono);font-size:21px;line-height:32px;padding:14px 22px;white-space:pre-wrap}
.cur{display:inline-block;width:11px;height:22px;background:var(--fg);vertical-align:-4px}
.side{width:340px;flex:none;background:var(--panel)}
.file{font-family:var(--mono);font-size:19px;padding:7px 22px;color:var(--mut)}.file.on{background:rgba(140,131,255,.16);color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:16px;padding:4px 12px;border-radius:999px;border:1px solid var(--line)}
.stage{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:20px 20px 22px}
.stage h4{font-size:22px;font-weight:600;margin-bottom:6px}.stage small{font-family:var(--mono);font-size:15px;color:var(--mut)}
.pbar{height:8px;border-radius:4px;background:rgba(236,232,217,.12);overflow:hidden;margin-top:16px}.pbar i{display:block;height:100%}
.ico{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:21px;line-height:1;padding:11px 20px;border-bottom:1px solid var(--line)}
.row .st{width:26px;text-align:center;font-weight:700}.row .nm{flex:1}.row .tm{color:var(--dim);font-size:17px}
.app{background:#f7f5ee;color:#25233f;border-radius:10px;padding:40px 44px;font-family:var(--ui)}
.app h2{font-size:30px;margin-bottom:6px}.app p{color:#5f5c56;font-size:18px}
.fld{margin-top:22px}.fld label{display:block;font-size:16px;font-weight:600;margin-bottom:8px}.fld .in{height:56px;border:2px solid #b9b5a6;border-radius:8px;background:#fff;display:flex;align-items:center;padding:0 16px;font-family:var(--mono);font-size:22px}
.btn{margin-top:30px;height:58px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tab{padding:12px 22px;font-family:var(--mono);font-size:16px;color:var(--mut)}.tab.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--acc)}
#cursor{position:absolute;left:0;top:0;width:30px;height:30px;z-index:50;opacity:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.final{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(20,19,42,.82)}
.final div{border:2px solid var(--ok);border-radius:20px;padding:36px 64px;background:#102a22;font-size:56px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:26px}
</style>
</head>
<body>
<div id="stage">
  <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="t">meridian-web — engineering workspace</span><span class="chip">Illustrative reconstruction</span></div>
  <div id="scenes"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.8L21 10.6z" fill="#fff" stroke="#14132a" stroke-width="1.5" stroke-linejoin="round"/></svg>
  <div class="rail"><span id="railn"></span><span class="segs" id="segs"></span><span>Fictional bank · synthetic data · not Lloyds Banking Group footage</span></div>
</div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const typed=(s,t,a,cps=40)=>s.slice(0,Math.max(0,Math.min(s.length,Math.floor((t-a)*cps))));
const blink=t=>Math.floor(t*2)%2===0;
const G='#5fd08f',A='#f2b84b',R='#ff6b6b',D='#6b6990';

const SCENES=[
 {id:'git',name:'Git workflow',len:4.5},{id:'jenkins',name:'Jenkins CI/CD pipeline',len:4},{id:'tests',name:'Frontend testing',len:4},
 {id:'defect',name:'Defect investigation',len:4},{id:'debug',name:'Debugging',len:4},{id:'regress',name:'Regression testing',len:3},{id:'release',name:'Release validation',len:4.5}];
let acc=0;SCENES.forEach(s=>{s.start=acc;acc+=s.len;});const TOTAL=acc;window.TOTAL=TOTAL;
const FADE=.35;

const CODE=[
 ['import','<span class="k">import</span> { <span class="f">useState</span> } <span class="k">from</span> <span class="s">\'react\'</span>;'],
 ['import','<span class="k">import</span> { <span class="y">Button</span> } <span class="k">from</span> <span class="s">\'@/components/ui\'</span>;'],
 ['blank',''],
 ['sc','<span class="k">const</span> SORT_CODE = <span class="s">/\\d{2}-\\d{2}-\\d{2}/</span>;'],
 ['blank',''],
 ['fn1','<span class="k">export function</span> <span class="f">validateSortCode</span>(value: <span class="y">string</span>): <span class="y">boolean</span> {'],
 ['fn2','  <span class="k">return</span> SORT_CODE.<span class="f">test</span>(value.<span class="f">trim</span>());'],
 ['fn3','}'],
 ['blank',''],
 ['c1','<span class="k">export function</span> <span class="f">TransferForm</span>({ onSubmit }: <span class="y">TransferFormProps</span>) {'],
 ['c2','  <span class="k">const</span> [sortCode, setSortCode] = <span class="f">useState</span>(<span class="s">\'\'</span>);'],
 ['c3','  <span class="k">const</span> valid = <span class="f">validateSortCode</span>(sortCode);'],
 ['c4','  <span class="k">return</span> &lt;<span class="y">Button</span> disabled={!valid}&gt;Continue&lt;/<span class="y">Button</span>&gt;;'],
 ['c5','}'],
];
function codeHTML(opts={}){ // opts: cls{key:class}, override{key:html}, upto
  return CODE.map(([k,h],i)=>`<div class="ln ${opts.cls&&opts.cls[k]||''}"><span class="n">${i+1}</span><span class="c">${opts.override&&opts.override[k]!==undefined?opts.override[k]:h}</span></div>`).join('');
}
function term(events,lt){
  let out='';let last=-1;
  events.forEach((e,i)=>{ if(lt>=e.t) last=i; });
  events.forEach((e,i)=>{
    if(lt<e.t) return;
    if(e.k==='cmd'){const s=typed(e.x,lt,e.t,e.cps||44);out+=`<div><span class="ok">➜</span> <span class="f">meridian-web</span> <span class="mu">${s}</span>${i===last&&s.length<e.x.length?'<span class="cur"></span>':''}</div>`;}
    else out+=`<div class="${e.c||'mu'}">${e.x}</div>`;
  });
  const lastEv=events[last];
  if(lastEv&&(lastEv.k!=='cmd'||typed(lastEv.x,lt,lastEv.t,lastEv.cps||44).length>=lastEv.x.length)&&blink(lt)) out+='<div><span class="ok">➜</span> <span class="f">meridian-web</span> <span class="cur"></span></div>';
  return out;
}
const check=(ok,pend)=>pend?`<span style="color:${D}">○</span>`:ok===true?`<span style="color:${G}">✓</span>`:ok==='run'?`<span style="color:${A}">◐</span>`:`<span style="color:${R}">✕</span>`;

/* ---------- Scene builders: each returns {html, cursor?} for local time lt ---------- */
function sGit(lt){
  const ev=[{t:.3,k:'cmd',x:'git checkout -b feature/sort-code-validation'},{t:1.05,k:'out',x:'Switched to a new branch \'feature/sort-code-validation\''},
   {t:1.35,k:'cmd',x:'git status --short'},{t:2.0,k:'out',x:' <span class="wn">M</span> src/components/TransferForm.tsx',c:'mu'},
   {t:2.25,k:'cmd',x:'git commit -am "feat: add sort code validation"',cps:48},{t:3.0,k:'out',x:'[feature/sort-code-validation 3f9a1c2] feat: add sort code validation'},
   {t:3.2,k:'cmd',x:'git push -u origin feature/sort-code-validation',cps:50},{t:3.95,k:'out',x:'branch \'feature/sort-code-validation\' set up to track \'origin/…\'.',c:'ok'}];
  const addOn=prog(lt,.2,.8);
  const committed=lt>=3.0,pushed=lt>=3.95;
  const cls=addOn>0?{sc:'add',fn1:'add',fn2:'add',fn3:'add'}:{};
  const files=['TransferForm.tsx','AccountSummary.tsx','Navigation.tsx','validation.test.ts','package.json'];
  const nodes=`<svg width="400" height="300" viewBox="0 0 400 300"><line x1="60" y1="30" x2="60" y2="270" stroke="${D}" stroke-width="3"/>
   <circle cx="60" cy="40" r="9" fill="${G}"/><circle cx="60" cy="110" r="9" fill="${G}"/>
   <path d="M60 110 C60 150 140 140 140 180" stroke="${A}" stroke-width="3" fill="none" opacity="${lt>1.0?1:0}"/>
   <circle cx="140" cy="180" r="9" fill="${A}" opacity="${lt>1.0?1:.0}"/>
   <circle cx="140" cy="240" r="9" fill="${committed?G:'none'}" stroke="${A}" stroke-width="3" opacity="${committed?1:0}"/>
   <text x="90" y="46" fill="#ece8d9" font-family="Menlo" font-size="17">main</text><text x="90" y="116" fill="#9a97b4" font-family="Menlo" font-size="15">release-ready build</text>
   <text x="170" y="186" fill="#f2b84b" font-family="Menlo" font-size="15">feature/sort-code-validation</text>
   <text x="170" y="246" fill="#ece8d9" font-family="Menlo" font-size="15" opacity="${committed?1:0}">3f9a1c2 feat: add sort code…</text>
   <text x="170" y="272" fill="#5fd08f" font-family="Menlo" font-size="15" opacity="${pushed?1:0}">↑ pushed to origin</text></svg>`;
  return {html:`
  <div style="display:grid;grid-template-columns:340px 1fr 480px;grid-template-rows:1fr 330px;gap:14px;padding:16px;height:960px">
   <div class="panel" style="grid-column:1;grid-row:1/3"><div class="ph"><span>Explorer</span></div>${files.map((f,i)=>`<div class="file ${i===0?'on':''}">${f}</div>`).join('')}</div>
   <div class="panel" style="grid-column:2;grid-row:1"><div class="ph"><span>TransferForm.tsx</span><span class="${lt>.3?'wn':''}">${lt>.3?'● modified':''}</span></div><div class="code" style="padding-top:12px">${codeHTML({cls})}</div></div>
   <div class="panel" style="grid-column:3;grid-row:1/3"><div class="ph"><span>Source control</span><span>${lt>1.0?'feature/sort-code-validation':'main'}</span></div>
     <div style="padding:20px 22px;font-family:var(--mono);font-size:19px;line-height:34px"><div class="mu">CHANGES</div>${lt>1.35&&!committed?'<div><span class="wn">M</span> TransferForm.tsx</div>':committed?'<div class="mu">No changes</div>':'<div class="mu">—</div>'}</div>
     <div class="ph" style="border-top:1px solid var(--line)"><span>Branch graph</span></div><div style="padding:14px 14px">${nodes}</div></div>
   <div class="panel" style="grid-column:2;grid-row:2"><div class="ph"><span>Terminal</span></div><div class="term" style="font-size:20px;line-height:30px;padding:10px 22px">${term(ev,lt)}</div></div>
  </div>`};
}
const STAGES=['Checkout','Install Dependencies','Build','Frontend Testing','Quality Checks','Release Validation'];
function stageHTML(i,state,p,dur){
  const col=state==='ok'?G:state==='run'?A:state==='fail'?R:D;
  const ic=state==='ok'?'✓':state==='run'?'●':state==='fail'?'✕':'';
  return `<div class="stage" style="border-color:${state==='pend'?'var(--line)':col+'66'}"><div class="ico" style="background:${col}22;color:${col};border:2px solid ${col}">${ic}</div><h4>${STAGES[i]}</h4><small>${state==='ok'?dur:state==='run'?'running…':state==='fail'?'failed':'pending'}</small><div class="pbar"><i style="width:${p*100}%;background:${col}"></i></div></div>`;
}
const DUR=['3s','18s','42s','1m 04s','22s','31s'];
function sJenkins(lt){
  // stage windows
  const w=[[.2,.7],[.7,1.4],[1.4,2.2],[2.2,3.4]];
  const states=STAGES.map((_,i)=>{
    if(i<4){const[a,b]=w[i];const p=prog(lt,a,b);return lt<a?['pend',0]:p>=1?(i===3?['fail',1]:['ok',1]):['run',p];}
    return ['pend',0];});
  if(lt<3.4) states[3]=lt<2.2?['pend',0]:['run',prog(lt,2.2,3.4)];
  const log=[[.2,'Started by commit 3f9a1c2 on feature/sort-code-validation'],[.3,'<span class="ok">✓</span> Checkout — git fetch origin'],[.8,'<span class="ok">✓</span> Install Dependencies — npm ci'],[1.5,'<span class="ok">✓</span> Build — next build'],[2.3,'<span class="wn">●</span> Frontend Testing — vitest run --coverage'],[3.0,'<span class="wn">●</span>   running 14 component and functional tests…'],[3.5,'<span class="bd">✕</span> Frontend Testing — 1 test failed, see report']];
  const bar=lt>3.4?'#ff6b6b':'#f2b84b';
  return {html:`<div style="padding:18px 22px;height:960px;display:grid;grid-template-columns:1fr 430px;grid-template-rows:auto auto 1fr;gap:16px">
   <div style="grid-column:1/3;display:flex;justify-content:space-between;align-items:baseline"><div style="font-size:32px;font-weight:600">meridian-web <span class="mu" style="font-weight:400">/ PR-482 / #118</span></div><div class="pill" style="color:${bar};border-color:${bar}66">${lt>3.4?'● Unstable':'● Running'}</div></div>
   <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;grid-column:1/3">${STAGES.map((_,i)=>stageHTML(i,states[i][0],states[i][1],DUR[i])).join('')}</div>
   <div class="panel"><div class="ph"><span>Console output</span><span>#118</span></div><div class="term">${log.filter(l=>lt>=l[0]).map(l=>`<div>${l[1]}</div>`).join('')}</div></div>
   <div class="panel"><div class="ph"><span>Build history</span></div>
     ${[['#118',lt>3.4?'✕':'◐',lt>3.4?R:A,'feature/sort-code-validation'],['#117','✓',G,'main'],['#116','✓',G,'main'],['#115','✓',G,'feature/navigation-a11y']].map(r=>`<div class="row"><span class="st" style="color:${r[2]}">${r[1]}</span><span class="nm">${r[0]}</span><span class="tm">${r[3]}</span></div>`).join('')}</div>
  </div>`};
}
const TESTS=[
 ['Components',[['AccountSummary renders balance','ok'],['TransferForm renders all fields','ok']]],
 ['Responsive layouts',[['mobile 375px — single column','ok'],['tablet 768px — two column','ok'],['desktop 1280px — dashboard grid','ok']]],
 ['Navigation',[['menu opens and closes with keyboard','ok'],['tab order follows visual order','ok']]],
 ['Form validation',[['accepts a valid sort code','ok'],['rejects an invalid sort code','fail'],['requires an amount','ok']]],
 ['Accessibility',[['form fields have labels','ok'],['no axe violations on transfer page','ok']]],
 ['User interactions',[['continue is disabled until valid','ok'],['confirmation dialog opens','ok']]]];
function testRows(lt,start,span,allPass){
  let idx=0;const total=TESTS.reduce((n,g)=>n+g[1].length,0);let rows='';let done=0,fail=0;
  TESTS.forEach(g=>{rows+=`<div class="ph" style="border-top:1px solid var(--line);padding:9px 20px">${g[0]}</div>`;
    g[1].forEach(([n,r])=>{const a=start+idx*(span/total);const b=a+span/total;const st=lt<a?'pend':lt<b?'run':(r==='fail'&&!allPass?'fail':'ok');
      if(st==='ok')done++;if(st==='fail'){fail++;}
      rows+=`<div class="row" style="padding:8px 20px;font-size:19px"><span class="st">${check(st==='ok'?true:st==='run'?'run':st==='fail'?false:null,st==='pend')}</span><span class="nm ${st==='fail'?'bd':''}">${n}</span><span class="tm">${st==='ok'||st==='fail'?(8+((idx*7)%30))+'ms':''}</span></div>`;idx++;});});
  return {rows,done,fail,total};
}
function sTests(lt){
  const r=testRows(lt,.3,2.4,false);const showFail=lt>2.9;
  return {html:`<div style="padding:18px 22px;display:grid;grid-template-columns:1fr 760px;gap:16px;height:960px">
   <div class="panel"><div class="ph"><span>vitest — meridian-web</span><span class="${r.fail?'bd':'wn'}">${r.fail?r.fail+' failed':'running'} · ${r.done} passed · ${r.total} total</span></div>${r.rows}
     <div style="padding:16px 20px"><div class="pbar" style="margin:0"><i style="width:${(r.done+r.fail)/r.total*100}%;background:${r.fail?R:A}"></i></div></div></div>
   <div class="panel" style="opacity:${showFail?1:.25}"><div class="ph"><span>Failure details</span><span class="bd">1 failed</span></div>
     <div class="term" style="font-size:20px;line-height:31px"><div class="bd">FAIL  Form validation › rejects an invalid sort code</div><div class="mu">TransferForm.test.tsx:42</div><div> </div>
      <div class="mu">  expect(validateSortCode('12-34-5678'))</div><div><span class="ok">  Expected:</span> false</div><div><span class="bd">  Received:</span> true</div><div> </div>
      <div class="mu">  &gt; 42 | expect(validateSortCode(bad)).<span class="f">toBe</span>(false);</div><div class="mu">       |                               ^</div><div> </div>
      <div class="wn">Next: reproduce in the browser and inspect.</div></div></div></div>`};
}
function sDefect(lt){
  const typedVal=typed('12-34-5678',lt,.8,9);
  const filled=typedVal.length>0;
  const tab=lt<1.5?0:lt<2.5?1:2; // console, network, components
  const cons=[[1.7,'wn','⚠ [meridian] validateSortCode("12-34-5678") → true'],[2.0,'bd','✕ expected false: sort code must be exactly 6 digits (NN-NN-NN)'],[2.2,'mu','TransferForm render: valid=true, Continue enabled']];
  const net=[['GET','/api/accounts','200','96 ms'],['POST','/api/payments/validate','200','142 ms'],['GET','/assets/app.css','200','18 ms']];
  const root=lt>3.2;
  const dev=tab===0?`<div class="term" style="font-size:20px;line-height:32px">${cons.filter(c=>lt>=c[0]).map(c=>`<div class="${c[1]}">${c[2]}</div>`).join('')}</div>`
   :tab===1?`<div>${net.map((n,i)=>`<div class="row" style="opacity:${prog(lt,2.55+i*.15,2.8+i*.15)};font-size:19px"><span class="st ${n[1]==='/api/payments/validate'?'wn':''}">${n[0]}</span><span class="nm">${n[1]}</span><span class="ok">${n[2]}</span><span class="tm">${n[3]}</span></div>`).join('')}<div class="term mu" style="font-size:19px">Response is 200: the defect is client-side validation, not the API.</div></div>`
   :`<div class="term" style="font-size:20px;line-height:32px"><div><span class="mu">&lt;</span><span class="y">TransferForm</span><span class="mu">&gt;</span></div><div class="mu">  state: sortCode = <span class="s">"12-34-5678"</span></div><div class="mu">  derived: valid = <span class="${root?'bd':''}">true</span></div>
      <div style="margin-top:14px;padding:14px 16px;border:1px solid ${root?R+'88':'var(--line)'};border-radius:10px;opacity:${root?1:0};font-size:19px;line-height:29px"><span class="bd">Root cause</span><br>SORT_CODE = <span class="s">/\\d{2}-\\d{2}-\\d{2}/</span> is not anchored,<br>so it matches part of a longer string.</div></div>`;
  const cx=lt<.7?[1400,500]:[560,470];
  return {html:`<div style="padding:18px 22px;display:grid;grid-template-columns:900px 1fr;gap:16px;height:960px">
   <div class="panel"><div class="ph"><span>Browser — localhost:3000/transfer</span><span class="${filled?'bd':''}">${filled?'defect reproduced':'reproducing'}</span></div>
    <div style="padding:30px"><div class="app"><h2>Send money</h2><p>Meridian Bank · synthetic test account</p>
      <div class="fld"><label>Sort code</label><div class="in" style="border-color:${filled?'#e0902f':'#b9b5a6'}">${typedVal}${blink(lt)&&filled&&typedVal.length<10?'|':''}${filled&&typedVal.length>=10?'<span style="margin-left:auto;color:#2a7048;font-family:var(--ui)">✓ Looks good</span>':''}</div></div>
      <div class="fld"><label>Amount</label><div class="in">£25.00</div></div>
      <div class="btn" style="background:${typedVal.length>=10?'#25233f':'#d5d2c4'};color:${typedVal.length>=10?'#fff':'#8a877d'}">Continue</div>
      <div style="margin-top:22px;opacity:${typedVal.length>=10?1:0};background:#fde8e8;color:#8a1f1f;border-radius:8px;padding:12px 16px;font-size:18px;font-weight:600">Defect: invalid sort code accepted</div></div></div></div>
   <div class="panel"><div class="ph"><span>Browser DevTools</span><span>${['Console','Network','Components'][tab]}</span></div><div class="tabs">${['Console','Network','Components'].map((n,i)=>`<div class="tab ${i===tab?'on':''}">${n}</div>`).join('')}</div>${dev}</div>
  </div>`,cursor:{x:cx[0]+(lt<.7?0:0),y:cx[1],show:lt<1.6,from:[1400,560],to:[560,470],p:ease(prog(lt,0,.7))}};
}
function sDebug(lt){
  const OLD='<span class="s">/\\d{2}-\\d{2}-\\d{2}/</span>';
  const NEWTXT='^\\d{2}-\\d{2}-\\d{2}$';
  const t=typed(NEWTXT,lt,1.4,16);const fixed=lt>2.4;
  const scLine=lt<1.3?OLD:`<span class="s">/${t.replace(/</g,'&lt;')}${lt>=1.4&&t.length<NEWTXT.length?'':''}/</span>${blink(lt)&&!fixed?'<span class="cur"></span>':''}`;
  const cls={sc:lt<1.3?'hl':fixed?'add':'hl',fn2:lt<.9?'':lt<1.3?'hl':''};
  const bp=lt<1.3;
  const vars=[['value','"12-34-5678"'],['SORT_CODE',lt<1.4?'/\\d{2}-\\d{2}-\\d{2}/':'/'+(fixed?NEWTXT:t)+'/'],['SORT_CODE.test(value)',fixed?'false':'true']];
  const diff=lt>3;
  return {html:`<div style="display:grid;grid-template-columns:1fr 560px;grid-template-rows:1fr 330px;gap:14px;padding:16px;height:960px">
   <div class="panel" style="grid-column:1;grid-row:1"><div class="ph"><span>TransferForm.tsx</span><span class="${bp?'wn':fixed?'ok':''}">${bp?'● paused at breakpoint':fixed?'● fixed':'● editing'}</span></div><div class="code" style="padding-top:12px">${codeHTML({cls,override:{sc:`<span class="k">const</span> SORT_CODE = ${scLine};`}})}</div></div>
   <div class="panel" style="grid-column:2;grid-row:1/3"><div class="ph"><span>Variables</span><span>debugger</span></div><div style="padding:18px 22px;font-family:var(--mono);font-size:20px;line-height:40px">${vars.map(v=>`<div><span class="f">${v[0]}</span><span class="mu"> = </span><span class="${v[0].includes('test')?(v[1]==='true'?'bd':'ok'):'s'}">${v[1]}</span></div>`).join('')}
     <div class="mu" style="margin-top:18px;line-height:30px;font-size:18px">${bp?'Pattern is not anchored: it matches inside the longer string.':fixed?'Anchored pattern rejects the invalid input.':'Updating the pattern…'}</div></div></div>
   <div class="panel" style="grid-column:1;grid-row:2"><div class="ph"><span>Git diff — TransferForm.tsx</span><span>${diff?'+1 −1':'unstaged'}</span></div><div class="code" style="font-size:21px;line-height:34px;padding-top:6px;opacity:${diff?1:.25}"><div class="ln del"><span class="n">4</span><span class="c">- <span class="k">const</span> SORT_CODE = <span class="s">/\\d{2}-\\d{2}-\\d{2}/</span>;</span></div><div class="ln add"><span class="n">4</span><span class="c">+ <span class="k">const</span> SORT_CODE = <span class="s">/^\\d{2}-\\d{2}-\\d{2}$/</span>;</span></div><div class="ln"><span class="n">5</span><span class="c mu">  </span></div></div></div>
  </div>`};
}
function sRegress(lt){
  const groups=[['Component tests',['AccountSummary','TransferForm','Navigation']],['Functional tests',['Transfer journey','Form validation','Confirmation']],['Responsive layout checks',['375px','768px','1280px']],['Accessibility checks',['Labels','Keyboard order','axe scan']],['Regression validation',['Sort code rejects 12-34-5678','Valid sort code accepted','Earlier fixes unchanged']]];
  const cards=groups.map((g,i)=>{const a=.2+i*.45,b=a+.55;const p=prog(lt,a,b);const ok=p>=1;
    return `<div class="stage" style="border-color:${ok?G+'66':'var(--line)'}"><h4>${g[0]}</h4><small>${ok?'passed':p>0?'running…':'pending'}</small>
      ${g[1].map((n,j)=>`<div class="mu" style="font-family:var(--mono);font-size:18px;margin-top:10px">${p>(j+1)/3-.02?`<span class="ok">✓</span>`:'<span style="color:#6b6990">○</span>'} ${n}</div>`).join('')}<div class="pbar"><i style="width:${p*100}%;background:${ok?G:A}"></i></div></div>`;}).join('');
  const all=lt>2.5;
  return {html:`<div style="padding:22px;height:960px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px"><div style="font-size:32px;font-weight:600">vitest — after fix <span class="mu" style="font-weight:400">/ commit 8c2d7e4</span></div><div class="pill" style="color:${all?G:A};border-color:${(all?G:A)}66">${all?'● All suites passed':'● Running'}</div></div>
   <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px">${cards}</div>
   <div class="panel" style="margin-top:18px"><div class="ph"><span>Result</span></div><div class="term">${all?'<div class="ok">✓ The earlier failure is resolved: rejects an invalid sort code — passed</div><div class="ok">✓ No regressions across the other checks</div>':'<div class="wn">● Re-running the full suite…</div>'}</div></div></div>`};
}
function sRelease(lt){
  const msgs=[[.9,'Build successful'],[1.35,'Frontend tests passed'],[1.8,'Defect resolved'],[2.25,'Regression checks passed'],[2.7,'Release validation completed']];
  const st=STAGES.map((_,i)=>{const a=.1+i*.14,b=a+.2;const p=prog(lt,a,b);return stageHTML(i,p>=1?'ok':p>0?'run':'pend',p,DUR[i]);}).join('');
  const fin=prog(lt,3.1,3.5);
  return {html:`<div style="padding:22px;height:960px;position:relative"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px"><div style="font-size:32px;font-weight:600">meridian-web <span class="mu" style="font-weight:400">/ main / #119</span></div><div class="pill" style="color:${lt>1.2?G:A};border-color:${(lt>1.2?G:A)}66">${lt>2.9?'● Success':'● Running'}</div></div>
   <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px">${st}</div>
   <div class="panel" style="margin-top:20px"><div class="ph"><span>Release validation dashboard</span></div>${msgs.map(m=>`<div class="row" style="opacity:${prog(lt,m[0],m[0]+.25)};font-size:25px;padding:16px 24px"><span class="st ok">✓</span><span class="nm">${m[1]}</span></div>`).join('')}</div>
   <div class="final" style="opacity:${fin}"><div style="transform:scale(${.96+.04*fin})"><span style="font-size:70px">✓</span><span>Release Ready — All Checks Passed</span></div></div></div>`};
}
const BUILD={git:sGit,jenkins:sJenkins,tests:sTests,defect:sDefect,debug:sDebug,regress:sRegress,release:sRelease};

const scenesEl=$('#scenes'),segsEl=$('#segs'),railn=$('#railn'),cursor=$('#cursor');
SCENES.forEach(s=>{const d=document.createElement('div');d.className='scene';d.id='sc-'+s.id;scenesEl.appendChild(d);const g=document.createElement('span');g.className='seg';g.innerHTML='<i></i>';segsEl.appendChild(g);});
window.render=function(t){
  t=((t%TOTAL)+TOTAL)%TOTAL;let cur=SCENES[0];
  SCENES.forEach((s,i)=>{
    const lt=t-s.start,el=$('#sc-'+s.id);
    const vis=lt>=-0.01&&lt<s.len+.01;
    const op=!vis?0:Math.min(prog(lt,0,FADE),1-prog(lt,s.len-FADE,s.len));
    // first scene fades in from the loop point; last fades out into it
    el.style.opacity=vis?op:0;
    if(vis&&op>0){const r=BUILD[s.id](clamp(lt,0,s.len));el.innerHTML=r.html;if(lt>=0&&lt<s.len)cur=s;
      if(r.cursor&&r.cursor.show){const c=r.cursor;cursor.style.opacity=1;cursor.style.left=(c.from[0]+(c.to[0]-c.from[0])*c.p)+'px';cursor.style.top=(c.from[1]+(c.to[1]-c.from[1])*c.p)+'px';}else if(s.id==='defect'){cursor.style.opacity=0;}}
    segsEl.children[i].firstChild.style.width=(prog(t,s.start,s.start+s.len)*100)+'%';
  });
  if(cur.id!=='defect')cursor.style.opacity=0;
  railn.innerHTML=`<b>${String(SCENES.indexOf(cur)+1).padStart(2,'0')} / 07</b> &nbsp; ${cur.name}`;
};
window.render(0);
</script>
