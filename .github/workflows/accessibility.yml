name: Accessibility

# Runs the axe-core suite against a live URL (default: production) on a schedule and on demand. The same
# suite also runs against every pull request's production build inside ci.yml. Automated checks find only
# a subset of WCAG issues; see docs/ACCESSIBILITY.md for the manual review that complements them.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to test'
        required: false
        default: 'https://www.dominicwokorach.me'

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe-core against ${{ inputs.url || 'https://www.dominicwokorach.me' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.url || 'https://www.dominicwokorach.me' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=a11y --project=a11y-mobile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: accessibility-reports
          path: |
            playwright-report/
            test-results/
            reports/junit/e2e.xml
          if-no-files-found: error
