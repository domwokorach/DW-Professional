name: Publish design-token package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-design-tokens-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@domwokorach"

      - name: Install dependencies
        run: npm ci

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-version.mjs

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build package
        run: npm run package:build

      - name: Publish package
        run: npm publish --workspace @domwokorach/dw-professional-design-tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
